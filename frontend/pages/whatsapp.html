<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WhatsApp Mock — Agent IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0C0F1A;--bg2:#141828;--bg3:#1C2235;--surface:#232840;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --accent:#4F6EFF;--teal:#00D4B4;--green:#00D97E;
  --text:#E8ECFF;--text2:#8B92B8;--text3:#555F85;
  --wa-dark:#111B21;--wa-mid:#1F2C34;--wa-light:#2A3942;
  --wa-green:#00A884;--wa-green2:#005C4B;
  --wa-bubble-in:#202C33;--wa-bubble-out:#005C4B;
  --font:'Outfit',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 50% 40% at 20% 10%,rgba(79,110,255,.1) 0%,transparent 70%);}

.navbar{
  background:rgba(12,15,26,.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:.75rem 1.5rem;
  display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50;
}
.nav-logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--teal));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.68rem;}
.nav-title{font-weight:700;font-size:.9rem;}
.nav-links{display:flex;gap:.2rem;margin-left:1rem;}
.nav-link{padding:.3rem .7rem;border-radius:6px;font-size:.8rem;color:var(--text2);text-decoration:none;transition:all .15s;}
.nav-link:hover,.nav-link.active{background:var(--surface);color:var(--text);}

.page{
  display:grid;grid-template-columns:340px 1fr;
  max-width:1000px;margin:2rem auto;padding:0 1.5rem;gap:1.5rem;
  position:relative;z-index:1;
}
@media(max-width:750px){.page{grid-template-columns:1fr;}}

/* Config panel */
.config-panel{display:flex;flex-direction:column;gap:1rem;}

.config-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.config-header{
  padding:.75rem 1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;
}
.config-header-icon{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--wa-green),#128C7E);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
}
.config-title{font-size:.85rem;font-weight:700;}
.config-body{padding:.9rem;}

.field{margin-bottom:.7rem;}
.field:last-child{margin-bottom:0;}
.field label{font-size:.72rem;color:var(--text3);display:block;margin-bottom:.3rem;font-weight:500;}
.field select,.field input{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  border-radius:8px;padding:.45rem .7rem;font-size:.82rem;
  color:var(--text);font-family:var(--font);outline:none;transition:border-color .2s;
}
.field select:focus,.field input:focus{border-color:var(--wa-green);}

.quick-msgs{display:flex;flex-direction:column;gap:.4rem;}
.qm-btn{
  padding:.45rem .7rem;background:var(--bg3);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text2);font-size:.75rem;font-family:var(--font);
  cursor:pointer;text-align:left;transition:all .15s;
}
.qm-btn:hover{border-color:var(--wa-green);color:var(--text);background:rgba(0,168,132,.06);}

/* WA Phone */
.wa-phone{
  background:var(--wa-dark);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;
  height:min(680px,80vh);
}

/* WA Header */
.wa-header{
  background:var(--wa-mid);padding:.85rem 1rem;
  display:flex;align-items:center;gap:.75rem;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
.wa-back{color:var(--wa-green);font-size:1.1rem;cursor:pointer;margin-right:.2rem;}
.wa-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--wa-green),#128C7E);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.88rem;color:white;flex-shrink:0;
}
.wa-info{flex:1;}
.wa-name{font-size:.9rem;font-weight:600;color:#E9EDEF;}
.wa-status{font-size:.68rem;color:#8696A0;}
.wa-actions{display:flex;gap:.5rem;color:#8696A0;}
.wa-action-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;transition:background .15s;}
.wa-action-icon:hover{background:rgba(255,255,255,.07);}

/* Messages */
.wa-bg{
  flex:1;overflow-y:auto;padding:1rem;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  display:flex;flex-direction:column;gap:.5rem;
}
.wa-bg::-webkit-scrollbar{width:4px;}
.wa-bg::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

/* Date separator */
.wa-date-sep{
  text-align:center;margin:.5rem 0;
}
.wa-date-sep span{
  background:rgba(17,27,33,.85);color:#8696A0;
  font-size:.68rem;padding:4px 12px;border-radius:8px;
  backdrop-filter:blur(4px);
}

/* Bubbles */
.wa-msg{display:flex;flex-direction:column;max-width:75%;animation:waBubbleIn .25s cubic-bezier(.34,1.56,.64,1);}
@keyframes waBubbleIn{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.wa-msg-in{align-self:flex-start;}
.wa-msg-out{align-self:flex-end;}

.wa-bubble{
  padding:.55rem .8rem .35rem;border-radius:8px;
  font-size:.85rem;line-height:1.5;color:#E9EDEF;
  position:relative;white-space:pre-wrap;word-break:break-word;
}
.wa-msg-in .wa-bubble{
  background:var(--wa-bubble-in);border-top-left-radius:0;
}
.wa-msg-out .wa-bubble{
  background:var(--wa-bubble-out);border-top-right-radius:0;
}
.wa-bubble.escalade{background:#3D2800;border-left:3px solid #FFA500;}
.wa-bubble.urgent{background:#3D0000;border-left:3px solid #FF5A65;}

.wa-bubble-tail{
  width:0;height:0;position:absolute;top:0;
  border:6px solid transparent;
}
.wa-msg-in .wa-bubble-tail{left:-6px;border-right-color:var(--wa-bubble-in);}
.wa-msg-out .wa-bubble-tail{right:-6px;border-left-color:var(--wa-bubble-out);}

.wa-meta{
  display:flex;align-items:center;gap:.3rem;justify-content:flex-end;
  margin-top:2px;
}
.wa-time{font-size:.6rem;color:#8696A0;}
.wa-check{font-size:.65rem;color:var(--wa-green);}

/* Typing */
.wa-typing .wa-bubble{padding:.7rem 1rem;}
.wa-typing-dots{display:flex;gap:4px;align-items:center;}
.wa-typing-dot{width:7px;height:7px;border-radius:50%;background:#8696A0;animation:waDot 1.3s infinite;}
.wa-typing-dot:nth-child(2){animation-delay:.18s;}
.wa-typing-dot:nth-child(3){animation-delay:.36s;}
@keyframes waDot{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* Input */
.wa-input-zone{
  background:var(--wa-mid);padding:.6rem .75rem;
  display:flex;align-items:center;gap:.5rem;flex-shrink:0;
  border-top:1px solid rgba(255,255,255,.05);
}
.wa-emoji-btn{
  width:36px;height:36px;border-radius:50%;
  background:transparent;border:none;cursor:pointer;
  color:#8696A0;font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  transition:color .15s;flex-shrink:0;
}
.wa-emoji-btn:hover{color:var(--wa-green);}
.wa-text-input{
  flex:1;background:var(--wa-light);border:none;border-radius:24px;
  padding:.55rem 1rem;font-size:.88rem;color:#E9EDEF;
  font-family:var(--font);outline:none;
}
.wa-text-input::placeholder{color:#8696A0;}
.wa-send-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--wa-green);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.wa-send-btn:hover{background:#009070;}

</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">IA</div>
  <div class="nav-title">WhatsApp Mock</div>
  <div class="nav-links">
    <a href="../index.html" class="nav-link">Accueil</a>
    <a href="chat.html" class="nav-link">Chat</a>
    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="ussd.html" class="nav-link">USSD</a>
    <a href="whatsapp.html" class="nav-link active">WhatsApp</a>
  </div>
</nav>

<div class="page">

  <!-- Config -->
  <div class="config-panel">

    <div class="config-card">
      <div class="config-header">
        <div class="config-header-icon">⚙</div>
        <div class="config-title">Configuration client</div>
      </div>
      <div class="config-body">
        <div class="field">
          <label>Client (selectionner)</label>
          <select id="sel-client" onchange="changerClient()">
            <option value="+221771234567|1234|Moussa Diallo|wave|fr">Moussa Diallo — Wave (FR)</option>
            <option value="+221772345678|5678|Fatou Ndiaye|wave|wo">Fatou Ndiaye — Wave (WO)</option>
            <option value="+221781234567|9999|Aminata Cisse|orange_money|fr">Aminata Cisse — Orange Money (FR)</option>
            <option value="+221783456789|4444|Rokhaya Fall|orange_money|wo">Rokhaya Fall — Orange Money (WO)</option>
            <option value="+221761234567|7777|Oumar Diop|mixx_by_yas|fr">Oumar Diop — Mixx by Yas (FR)</option>
            <option value="+221774567890|1111|Mamadou Ba|wave|fr-wo">Mamadou Ba — Wave (FR-WO)</option>
          </select>
        </div>
        <div class="field">
          <label>PIN (auto-rempli)</label>
          <input type="password" id="inp-pin-wa" value="1234" maxlength="4" placeholder="••••"/>
        </div>
        <button onclick="reinitWA()" style="width:100%;padding:.45rem;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:.78rem;font-family:var(--font);cursor:pointer;margin-top:.4rem;transition:all .15s;"
          onmouseover="this.style.borderColor='var(--wa-green)';this.style.color='var(--wa-green)'"
          onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--text2)'">
          ↺ Nouvelle conversation
        </button>
      </div>
    </div>

    <div class="config-card">
      <div class="config-header">
        <div class="config-header-icon">💬</div>
        <div class="config-title">Messages rapides</div>
      </div>
      <div class="config-body">
        <div class="quick-msgs">
          <button class="qm-btn" onclick="prefill('Bonjour, quel est mon solde ?')">💰 Consulter mon solde</button>
          <button class="qm-btn" onclick="prefill('Mon transfert de 25000 XOF n\'est pas arrive')">⏳ Transfert non arrive</button>
          <button class="qm-btn" onclick="prefill('L\'agent a pris mon argent sans crediter mon compte')">🚨 Litige agent</button>
          <button class="qm-btn" onclick="prefill('Mon compte a ete pirate, des transactions que je n\'ai pas faites !')">🔒 Suspicion fraude</button>
          <button class="qm-btn" onclick="prefill('sama xaalis bi des du ko')">🗣 Transfert non recu (Wolof)</button>
          <button class="qm-btn" onclick="prefill('Je veux parler a un conseiller humain')">👤 Demander conseiller</button>
          <button class="qm-btn" onclick="prefill('Quels sont les frais de transfert ?')">❓ FAQ frais</button>
        </div>
      </div>
    </div>

  </div>

  <!-- WhatsApp Phone -->
  <div class="wa-phone">
    <div class="wa-header">
      <div class="wa-back">‹</div>
      <div class="wa-avatar" id="wa-avatar">IA</div>
      <div class="wa-info">
        <div class="wa-name">Agent IA Support</div>
        <div class="wa-status" id="wa-status">En ligne</div>
      </div>
      <div class="wa-actions">
        <div class="wa-action-icon">📹</div>
        <div class="wa-action-icon">📞</div>
        <div class="wa-action-icon">⋮</div>
      </div>
    </div>

    <div class="wa-bg" id="wa-messages">
      <div class="wa-date-sep"><span>Aujourd'hui</span></div>
      <div class="wa-msg wa-msg-in">
        <div class="wa-bubble" style="position:relative">
          <div class="wa-bubble-tail"></div>
          Bienvenue ! Selectionnez un client dans le panneau de gauche et entrez votre PIN pour commencer.
        </div>
        <div class="wa-meta">
          <span class="wa-time">maintenant</span>
        </div>
      </div>
    </div>

    <div class="wa-input-zone">
      <button class="wa-emoji-btn">😊</button>
      <input class="wa-text-input" id="wa-input" placeholder="Message"
             onkeydown="if(event.key==='Enter')envoyerWA()"/>
      <button class="wa-send-btn" onclick="envoyerWA()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
const API = 'http://localhost:8000/api/v1';
let idSession = null, telephone = '+221771234567', pinEnvoye = false;
let nomClient = 'Client', nbMsgs = 0;

function heure() {
  return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function changerClient() {
  const parts = document.getElementById('sel-client').value.split('|');
  telephone = parts[0];
  document.getElementById('inp-pin-wa').value = parts[1];
  nomClient = parts[2];
  const operateur = parts[3];
  const initiales = parts[2].split(' ').map(n=>n[0]).join('').slice(0,2);
  document.getElementById('wa-avatar').textContent = initiales;
}

function reinitWA() {
  idSession = null; pinEnvoye = false; nbMsgs = 0;
  document.getElementById('wa-messages').innerHTML = `
    <div class="wa-date-sep"><span>Aujourd'hui</span></div>
    <div class="wa-msg wa-msg-in">
      <div class="wa-bubble" style="position:relative">
        <div class="wa-bubble-tail"></div>
        Nouvelle conversation demarree. Envoyez votre PIN pour vous authentifier.
      </div>
      <div class="wa-meta"><span class="wa-time">${heure()}</span></div>
    </div>`;
  changerClient();
}

function prefill(msg) {
  document.getElementById('wa-input').value = msg;
  document.getElementById('wa-input').focus();
}

function ajouterMsg(texte, direction, style='') {
  const zone = document.getElementById('wa-messages');
  const div = document.createElement('div');
  div.className = `wa-msg wa-msg-${direction}`;
  const tailSide = direction === 'in' ? 'left:-6px;border-right-color:var(--wa-bubble-in)' : 'right:-6px;border-left-color:var(--wa-bubble-out)';
  div.innerHTML = `
    <div class="wa-bubble ${style}" style="position:relative">
      <div class="wa-bubble-tail" style="${tailSide}"></div>
      ${texte}
    </div>
    <div class="wa-meta">
      <span class="wa-time">${heure()}</span>
      ${direction==='out'?'<span class="wa-check">✓✓</span>':''}
    </div>`;
  zone.appendChild(div);
  zone.scrollTop = zone.scrollHeight;
}

function afficherTyping(show) {
  const existing = document.getElementById('wa-typing');
  if (show && !existing) {
    const zone = document.getElementById('wa-messages');
    const div = document.createElement('div');
    div.className = 'wa-msg wa-msg-in wa-typing'; div.id = 'wa-typing';
    div.innerHTML = `<div class="wa-bubble" style="position:relative">
      <div class="wa-bubble-tail" style="left:-6px;border-right-color:var(--wa-bubble-in)"></div>
      <div class="wa-typing-dots"><div class="wa-typing-dot"></div><div class="wa-typing-dot"></div><div class="wa-typing-dot"></div></div>
    </div>`;
    zone.appendChild(div);
    zone.scrollTop = zone.scrollHeight;
    document.getElementById('wa-status').textContent = 'en train d\'ecrire...';
  } else if (!show && existing) {
    existing.remove();
    document.getElementById('wa-status').textContent = 'En ligne';
  }
}

async function envoyerWA() {
  const inp = document.getElementById('wa-input');
  let msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';

  // Auth PIN auto si premiere fois
  if (!pinEnvoye) {
    const pin = document.getElementById('inp-pin-wa').value;
    if (!idSession) idSession = 'wa_' + Date.now();
    pinEnvoye = true;
    try {
      await fetch(`${API}/chat/message`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id_session: idSession, telephone, message: pin, canal: 'whatsapp' })
      });
    } catch(e) {}
  }

  ajouterMsg(msg, 'out');
  afficherTyping(true);
  nbMsgs++;

  try {
    if (!idSession) idSession = 'wa_' + Date.now();
    const res = await fetch(`${API}/chat/message`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id_session: idSession, telephone, message: msg, canal: 'whatsapp' })
    });
    const data = await res.json();
    afficherTyping(false);
    const style = data.escalade ? (data.priorite==='P1'?'urgent':'escalade') : '';
    ajouterMsg(data.reponse || '...', 'in', style);
    if (data.id_ticket) {
      ajouterMsg(`📄 *Ticket cree :* ${data.id_ticket}\nPriorite ${data.priorite} — SLA : ${data.regle_escalade||'standard'}\n<a href="${API}/rapports/${data.id_ticket}/pdf" style="color:#00A884" target="_blank">Telecharger rapport PDF ↗</a>`, 'in');
    }
  } catch(e) {
    afficherTyping(false);
    ajouterMsg('Service momentanement indisponible.\nVerifiez que le backend tourne sur localhost:8000', 'in');
  }
}

// Init
changerClient();
</script>
</body>
</html>
