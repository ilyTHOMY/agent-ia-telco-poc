# nginx.conf — configuration pour le frontend HTML/CSS/JS pur
# Remplace le nginx.conf par defaut dans le container frontend

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Charset UTF-8 pour le francais et le wolof
    charset utf-8;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # Page d'accueil
    location = / {
        try_files /index.html =404;
    }

    # Fichiers statiques avec cache
    location ~* \.(css|js|json|png|jpg|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Pages HTML
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Headers CORS pour les appels API depuis le frontend
    add_header Access-Control-Allow-Origin "http://localhost:8000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
